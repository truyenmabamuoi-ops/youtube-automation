name: Tự động hóa YouTube

on:
  workflow_dispatch: # Cho phép bấm nút chạy thủ công ở tab Hành động
  schedule:
    - cron: '0 0 * * *' # Chạy tự động mỗi ngày

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Mã nguồn checkout
      uses: actions/checkout@v3

    - name: Thiết lập Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Cài đặt thư viện
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Chạy script factory
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python run.factory.py
